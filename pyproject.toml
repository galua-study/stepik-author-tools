[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stepik-author-tools"
version = "0.1.0"
description = "Build Stepik imports, compare author sources, and prepare three-way patches"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["markdown-it-py>=3,<5", "beautifulsoup4>=4.12,<5", "pydantic>=2.12,<3"]

[project.urls]
Repository = "https://github.com/galua-study/stepik-author-tools"
Issues = "https://github.com/galua-study/stepik-author-tools/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "ruff==0.17.6", "mypy==2.4.1", "build>=1.2,<2"]

[project.scripts]
stepik-author = "stepik_author_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv*", "out"]
# Course Markdown is content, not implementation: never reformat its code fences.
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "C901", "D100", "D101", "D102", "D103", "ANN", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", ".github/scripts"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.setuptools.package-data]
stepik_author_tools = ["py.typed"]
"stepik_author_tools.config" = ["defaults.toml"]
