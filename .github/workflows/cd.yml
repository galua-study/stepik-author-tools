name: CD

on:
  push:
    tags: ['v*']
  # A manual run exercises delivery without creating a public release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag against package version
        shell: python
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == f'v{version}', 'Tag must match pyproject.toml version'
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      # Default build creates the wheel from the sdist, checking its completeness.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Write SHA-256 checksums
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          files = sorted(Path('dist').glob('*'))
          checksums = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files)
          Path('dist/SHA256SUMS').write_text(checksums, encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
        distribution: ['*.whl']
        include:
          - os: ubuntu-latest
            python: '3.12'
            distribution: '*.tar.gz'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Install built distribution
        shell: python
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path
          package, = Path('dist').glob(os.environ['DISTRIBUTION'])
          subprocess.run([sys.executable, '-m', 'pip', 'install', f'{package}[test]'], check=True)
      - run: python -m pip check
      - name: Verify installed package origin
        shell: python
        run: |
          import sys
          from pathlib import Path
          import stepik_author_tools
          assert Path(stepik_author_tools.__file__).is_relative_to(Path(sys.prefix))
      # Includes the real console command and the offline build/diff/pull demo.
      - run: python -m pytest -q

  release:
    needs: install
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
